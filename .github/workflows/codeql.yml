name: CodeQL

# Matrix covers primary stacks (JS/TS, Python, Android). Optional examples/rust and
# examples/go are excluded — see modules/rust/MODULE.md and modules/go/MODULE.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack-presence:
    name: Detect active stacks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.stacks.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: stacks
        run: |
          include='[{"language":"python"},{"language":"java-kotlin","paths":"examples/android"}]'
          if [ -f examples/web/package-lock.json ] || [ -f examples/node/package-lock.json ]; then
            include='[{"language":"javascript-typescript"},{"language":"python"},{"language":"java-kotlin","paths":"examples/android"}]'
          fi
          echo "matrix=$(jq -cn --argjson include "$include" '{include:$include}')" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze
    needs: stack-presence
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.stack-presence.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java (Android)
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v4
      - name: Accept Android SDK licenses
        if: matrix.language == 'java-kotlin'
        run: yes | sdkmanager --licenses
      - name: Initialize CodeQL (repo-wide)
        if: matrix.language != 'java-kotlin'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Initialize CodeQL (Android)
        if: matrix.language == 'java-kotlin'
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          paths: examples/android
      - name: Build Android (CodeQL traced)
        if: matrix.language == 'java-kotlin'
        working-directory: examples/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: github/codeql-action/analyze@v4
